name: Build, Push and Deploy ToDo App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: todos
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      ALLOWED_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest "httpx<0.28"

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v5

      - name: Log into Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            geoffreysakora/containerized-todo-app-api:latest
            geoffreysakora/containerized-todo-app-api:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            geoffreysakora/containerized-todo-app-frontend:latest
            geoffreysakora/containerized-todo-app-frontend:${{ github.sha }}

  deploy-to-server:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull geoffreysakora/containerized-todo-app-api:latest
            docker pull geoffreysakora/containerized-todo-app-frontend:latest
            
            docker stop containerized-todo-app-api-1 || true
            docker rm containerized-todo-app-api-1 || true
            
            docker stop containerized-todo-app-frontend-1 || true
            docker rm containerized-todo-app-frontend-1 || true
            
            docker network create todo-net 2>/dev/null || true

            docker run -d --name containerized-todo-app-api-1 --network todo-net --network-alias api --env-file $HOME/.env --restart unless-stopped -p 127.0.0.1:8000:8000 geoffreysakora/containerized-todo-app-api:latest

            docker run -d --name containerized-todo-app-frontend-1 --network todo-net --restart unless-stopped -p 8081:80 geoffreysakora/containerized-todo-app-frontend:latest

            for i in $(seq 1 15); do
              if curl -fs localhost:8000/health >/dev/null; then
                echo "healthy after $((i*2))s"; exit 0
              fi
              sleep 2
            done
            echo "health check failed"
            docker logs --tail 30 containerized-todo-app-api-1
            exit 1
